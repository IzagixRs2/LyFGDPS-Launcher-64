name: Build LyFGDPS Launcher

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Restore signing keystore
        shell: bash
        env:
          KEYSTORE_FILE: ${{ secrets.KEYSTORE_FILE }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_FILE"
          printf '%s' "$KEYSTORE_FILE" | base64 --decode > "$HOME/release.keystore"
          test -s "$HOME/release.keystore"

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Build signed LyFGDPS Launcher APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          ./gradlew :app:assembleStandardRelease --no-daemon --stacktrace \
            -Pandroid.injected.signing.store.file="$HOME/release.keystore" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      - name: Select APK and rename
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk -type f -path '*/release/*.apk' | grep -E 'universal|arm64-v8a' | head -n 1 || true)"
          if [ -z "$APK" ]; then
            APK="$(find app/build/outputs/apk -type f -path '*/release/*.apk' | head -n 1 || true)"
          fi
          test -n "$APK"
          cp "$APK" "$GITHUB_WORKSPACE/LyFGDPS-Launcher.apk"
          echo "APK=$APK"
          ls -lh "$GITHUB_WORKSPACE/LyFGDPS-Launcher.apk"

      - name: Upload LyFGDPS-Launcher.apk
        uses: actions/upload-artifact@v4
        with:
          name: LyFGDPS-Launcher
          path: LyFGDPS-Launcher.apk
          if-no-files-found: error
